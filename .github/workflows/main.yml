name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent Name'
        required: true
        default: '2Vr1Sj2nkYXLiD8bZmmiPWU4Wh8f85DTbNctJdCHJS'
      agent_description:
        description: 'Agent Description'
        required: true
        default: '2Vr1Sj2nkYXLiD8bZmmiPWU4Wh8f85DTbNctJdCHJS AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # ✅ Safe install (won’t break if clawhub fails)
      - name: Install ClawHub skill (optional)
        run: |
          npx --yes clawhub@latest install verified-agent-identity || echo "ClawHub install skipped"

      - name: Install script dependencies
        run: |
          if [ -d "scripts" ]; then
            cd scripts
            npm install
          else
            echo "scripts folder not found"
            exit 1
          fi

      - name: Step 2 - Create new Ethereum Identity
        run: |
          if [ -f "scripts/createNewEthereumIdentity.js" ]; then
            node scripts/createNewEthereumIdentity.js
          else
            echo "createNewEthereumIdentity.js not found"
            exit 1
          fi

      - name: Step 3 - Link Human to Agent
        run: |
          if [ -f "scripts/manualLinkHumanToAgent.js" ]; then
            node scripts/manualLinkHumanToAgent.js --challenge "{\"name\": \"${{ github.event.inputs.agent_name }}\", \"description\": \"${{ github.event.inputs.agent_description }}\"}"
          else
            echo "manualLinkHumanToAgent.js not found"
            exit 1
          fi
